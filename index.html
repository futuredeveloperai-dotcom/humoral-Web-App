<style>
:root{--bg:#FBFAF4;--surface:#fff;--line:#E7E5D9;--ink:#2C2721;--soft:#6E675A;--brand:#3E7A44;--gold:#C9A227}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro","Segoe UI",system-ui,sans-serif;
  font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%;
  padding:calc(20px + env(safe-area-inset-top,0)) 16px calc(32px + env(safe-area-inset-bottom,0));
}
main{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
img,button{-webkit-touch-callout:none}
.mark{border:2px dotted var(--gold);border-radius:26px;padding:22px 22px 16px;background:var(--surface);text-align:center;
  box-shadow:0 1px 2px rgba(44,39,33,.05),0 8px 20px -12px rgba(44,39,33,.16)}
.mark img{width:112px;height:112px;object-fit:contain;display:block;margin:0 auto;border-radius:26px}
.mark .b1{font-size:28px;font-weight:800;margin-top:8px;line-height:1.25}
.mark .rule{width:56px;height:2px;border-radius:2px;background:var(--gold);opacity:.65;margin:10px auto}
.mark .b2{font-size:19px;font-weight:700;color:var(--brand)}
.appname{text-align:center;font-size:19px;font-weight:800;margin:18px 0 0;line-height:1.4}
h2{font-size:14.5px;font-weight:700;color:var(--soft);margin:22px 4px 10px;text-align:center}
h2.start{text-align:start}
.langpick{position:relative;width:100%}
.langpick select{
  width:100%;appearance:none;-webkit-appearance:none;font:inherit;font-size:17px;font-weight:700;color:var(--ink);
  background:var(--surface);border:1.5px solid var(--line);border-radius:15px;padding:16px 50px;text-align:center;text-align-last:center;
  box-shadow:0 1px 2px rgba(44,39,33,.05);cursor:pointer;
}
.langpick select:focus{outline:none;border-color:var(--brand)}
.langpick .globe,.langpick .caret{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none}
.langpick .globe{color:var(--brand);display:flex}
.langpick .globe svg{width:22px;height:22px}
.langpick .caret{color:var(--soft);font-size:14px}
[dir=rtl] .langpick .globe{right:16px} [dir=ltr] .langpick .globe{left:16px}
[dir=rtl] .langpick .caret{left:18px}  [dir=ltr] .langpick .caret{right:18px}
a.app{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(44,39,33,.05),0 8px 20px -12px rgba(44,39,33,.16);touch-action:manipulation}
a.app:active{transform:scale(.985)}
a.app .ic{flex:0 0 auto;width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff}
a.app .ic svg{width:28px;height:28px}
a.app .t{flex:1;min-width:0}
a.app b{display:block;font-size:18px;font-weight:800;line-height:1.3}
a.app span{display:block;font-size:13.5px;color:var(--soft);margin-top:3px}
a.app .fb{color:var(--brand);font-weight:700}
a.app .chev{flex:0 0 auto;color:var(--soft);font-size:22px}
.cta{display:block;width:100%;margin:6px 0 0;border-radius:15px;padding:16px;text-align:center;font-size:16.5px;font-weight:700;
  color:#fff;background:var(--brand);border:0;box-shadow:0 8px 20px -10px rgba(62,122,68,.6)}
.cta.installbtn{background:var(--surface);color:var(--brand);border:1.5px solid var(--brand);box-shadow:none}
.installbtn[hidden]{display:none !important}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 18px;margin-top:4px}
.howto details{padding:12px 0;border-top:1px solid var(--line)}
.howto details:first-child{border-top:0}
.howto summary{font-weight:800;font-size:16px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"+";color:var(--brand);font-weight:800;font-size:20px;line-height:1}
.howto details[open] summary::before{content:"−"}
.howto ol{margin:8px 0 0;padding-inline-start:22px;color:var(--ink)}
.howto li{margin:5px 0}
.howto .note{font-size:14px;color:var(--soft);margin:8px 0 0}
.howto .note.ink{color:var(--ink);margin-top:6px}
footer{text-align:center;font-size:13px;color:var(--soft);margin-top:28px;line-height:1.9}
footer a{color:var(--brand);text-decoration:none;font-weight:700}
@media (prefers-color-scheme:dark){
  :root{--bg:#12110E;--surface:#1D1C17;--line:#302E27;--ink:#F1EEE3;--soft:#A6A093}

}

    store('tadawi.hub.lang', code);
    store('tadawi.web.v1.lang', JSON.stringify(code));

  var sel = document.getElementById('langsel');

    sel.appendChild(o);
  });

  apply(initial());
})();
</script>

<script>
/* يسجّل عامل الخدمة الموحّد (sw.js في جذر الموقع) ليعمل التطبيق كلّه بلا إنترنت بعد أول فتح من الرابط
   (لا يعمل عند فتح الملف محلياً، وهذا طبيعي). التحديث تلقائي: كلّما فُتح التطبيق ومعه إنترنت يُفحص وجود نسخة
   أجدد وتُنزَّل في الخلفية، ثم يظهر شريط «يتوفّر تحديث جديد» وضغطة واحدة تعيد التحميل بالنسخة الجديدة. */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    var REL = './';
    var shown = false;
    function offerUpdate() {
      if (shown) return; shown = true;
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = 'يتوفّر تحديث جديد — اضغط للتحديث · Update available — tap to refresh';
      b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9999;' +
        'padding:14px 16px;border:0;border-radius:14px;background:#3E7A44;color:#fff;' +
        'font:700 15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;' +
        'box-shadow:0 8px 24px -8px rgba(0,0,0,.45);cursor:pointer;direction:rtl;text-align:center';
      b.onclick = function () { b.disabled = true; location.reload(); };
      document.body.appendChild(b);
    }
    /* عمّال الخدمة القدامى (نسخة كان لكل تطبيق عامل خاص) يُزالون */
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { if (new RegExp('/(humoral|mazag)/$').test(r.scope)) r.unregister(); });
    }).catch(function () {});
    navigator.serviceWorker.register(REL + 'sw.js', { scope: REL }).then(function (reg) {
      if (reg.waiting && navigator.serviceWorker.controller) offerUpdate();
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) offerUpdate();
        });
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update().catch(function () {});
      });
    }).catch(function () {});
  });
}
</script>
