# إعدادات نشر Netlify: الموقع ثابت، يُنشر من جذر المستودع بلا أي أمر بناء
[build]
  publish = "."

# عامل الخدمة يجب ألّا يُخزَّن حتى تصل التحديثات فوراً
[[headers]]
  for = "/humoral/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/mazag/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
