<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6F52">
<title>تقييم المزاج العام للمريض — دار التداوي</title>
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-title" content="تقييم المزاج">
<meta name="application-name" content="تقييم المزاج">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="دار التداوي">
<meta property="og:title" content="استمارة تقييم المزاج العام للمريض — دار التداوي">
<meta property="og:description" content="٢٩ بنداً وجدول النبض مع طباعة A4 بست لغات — الدكتور هاني البطل">
<meta property="og:image" content="https://futuredeveloperai-dotcom.github.io/humoral-Web-App/humoral/icons/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:url" content="https://futuredeveloperai-dotcom.github.io/humoral-Web-App/mazag/">
<meta property="og:locale" content="ar_AR">

<style>
/* ============ الهوية ============ */
:root{
  --ink:#26291F; --ink-2:#5A6152; --paper:#FBFAF5; --card:#FFFFFF;
  --olive-bg:#E8EDD7; --olive-line:#96A86B; --olive-deep:#5B6E33;
  --green:#1F6F52; --leaf:#57B24A; --rule:#DFE1D4;
  --r:14px; --shadow:0 1px 2px rgba(38,41,31,.06), 0 8px 24px -14px rgba(38,41,31,.22);
  --ar-serif:"Amiri","Traditional Arabic","Al Bayan","Sakkal Majalla",serif;
  --ar-sans:"Tajawal","IBM Plex Sans Arabic","Segoe UI","Helvetica Neue",Tahoma,sans-serif;
  --lt-serif:Georgia,"Times New Roman",serif;
  --lt-sans:"Segoe UI","Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --serif:var(--ar-serif); --sans:var(--ar-sans);
}
html[lang]:not([lang=ar]){ --serif:var(--lt-serif); --sans:var(--lt-sans); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.65; -webkit-text-size-adjust:100%;
}
button,input,textarea,select{font:inherit;color:inherit}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============ شاشة اللغة ============ */
#s-lang{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 18px calc(30px + env(safe-area-inset-bottom,0))}
#s-lang .dotted{border:2px dotted #C9A227;border-radius:26px;padding:26px 30px 22px;text-align:center;
  background:#fff;width:100%;max-width:420px;box-shadow:0 1px 2px rgba(44,39,33,.05),0 8px 20px -12px rgba(44,39,33,.16)}
#s-lang .dotted img{width:150px;height:150px;object-fit:contain}
#s-lang .b1{font-family:var(--ar-serif);font-size:34px;font-weight:700;margin-top:12px;line-height:1.25}
#s-lang .rule{width:56px;height:2px;border-radius:2px;background:#C9A227;opacity:.65;margin:13px auto}
#s-lang .b2{font-family:var(--ar-serif);font-size:23px;font-weight:700;color:#3E7A44;line-height:1.35}
@media (max-height:700px){
  #s-lang .dotted img{width:112px;height:112px}
  #s-lang .b1{font-size:27px} #s-lang .b2{font-size:19px}
}
#s-lang .appname{font-family:var(--ar-serif);font-size:19px;font-weight:700;line-height:1.4;
  margin:22px 0 0;max-width:420px;color:var(--ink)}
#s-lang h2{font-size:14.5px;margin:16px 0 12px;font-weight:700;color:var(--ink-2)}
.langpick{position:relative;width:100%;max-width:420px}
.langpick select{
  width:100%;appearance:none;-webkit-appearance:none;
  font:inherit;font-size:17px;font-weight:600;color:var(--ink);
  background:#fff;border:1.5px solid var(--line, #E0DCCC);border-radius:14px;
  padding:17px 50px 17px 50px;text-align:center;text-align-last:center;
  box-shadow:0 1px 2px rgba(44,39,33,.05);cursor:pointer;
}
.langpick select:focus{outline:none;border-color:#C9A227}
.langpick .caret{position:absolute;inset-inline-end:18px;top:50%;transform:translateY(-50%);
  pointer-events:none;color:#9A9482;font-size:15px}
.langpick .globe{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);
  pointer-events:none;color:#3E7A44;display:flex}
.langpick .globe svg{width:22px;height:22px}
.langgo{
  width:100%;max-width:420px;margin-top:14px;font:inherit;font-size:16.5px;font-weight:700;
  color:#fff;background:#3E7A44;border:0;border-radius:14px;padding:16px;cursor:pointer;
  box-shadow:0 8px 20px -10px rgba(62,122,68,.6);
}
.langgo:active{transform:scale(.985)}
.langgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
.langbtn{padding:16px 10px;border:1.5px solid var(--rule);border-radius:14px;background:var(--card);
  font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(38,41,31,.05)}
.langbtn:active{transform:translateY(1px)}
.langbtn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.langbtn:last-child:nth-child(odd){grid-column:1/-1}

/* ============ الترويسة ============ */
.top{
  position:sticky; top:0; z-index:40; background:rgba(251,250,245,.94);
  -webkit-backdrop-filter:saturate(150%) blur(10px);backdrop-filter:saturate(150%) blur(10px);
  border-bottom:1px solid var(--rule); padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top,0));
}
.top-in{display:flex;align-items:center;gap:11px;max-width:760px;margin:0 auto}
.top img{width:42px;height:42px;object-fit:contain;flex:0 0 auto}
.top .ttl{flex:1;min-width:0}
.top h1{margin:0;font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.2px}
.top .sub{margin:0;font-size:12px;color:var(--ink-2);letter-spacing:.3px}
.top .lang{flex:0 0 auto;border:1px solid var(--rule);background:#fff;border-radius:10px;
  padding:7px 10px;font-size:14px;cursor:pointer;color:var(--ink-2)}
.top .lang:focus-visible{outline:2px solid var(--green);outline-offset:1px}

/* شريط المزاج — العنصر المميّز */
.spine{max-width:760px;margin:10px auto 0;display:flex;height:9px;border-radius:99px;overflow:hidden;
  background:#EDEEE6;border:1px solid var(--rule)}
.spine i{display:block;transition:flex-grow .45s cubic-bezier(.4,0,.2,1);flex-grow:0;flex-basis:0;min-width:0}
.spine-legend{max-width:760px;margin:6px auto 0;display:flex;gap:12px;justify-content:space-between;
  font-size:11.5px;color:var(--ink-2);flex-wrap:wrap}
.spine-legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.spine-legend b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:3px;border:1px solid rgba(38,41,31,.22);display:inline-block}

/* ============ الجسم ============ */
main{max-width:760px;margin:0 auto;padding:16px 14px 132px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card > h2{margin:0 0 4px;font-family:var(--serif);font-size:18px;font-weight:700}
.card > .note{margin:0 0 14px;font-size:12.5px;color:var(--ink-2)}

.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
label.lb{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.inp{width:100%;padding:11px 12px;border:1px solid var(--olive-line);border-radius:10px;
  background:var(--olive-bg);font-size:16px}
.inp:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* اختيار الجنس */
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:11px;border:1px solid var(--olive-line);background:#fff;border-radius:10px;
  font-weight:600;font-size:15px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}

/* جدول النبض */
.pulse{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.pulse table{border-collapse:collapse;width:100%;min-width:430px;font-size:12.5px}
.pulse th,.pulse td{border:1px solid var(--olive-line);padding:6px 5px;text-align:center}
.pulse thead th{background:var(--olive-bg);font-weight:600;font-size:11.5px;line-height:1.35}
.pulse tbody th{background:#FCFBF4;text-align:start;font-weight:500;line-height:1.5;
  font-size:12px;min-width:150px}
.pulse input{width:100%;min-width:48px;border:0;background:transparent;text-align:center;
  padding:9px 2px;font-size:16px;font-variant-numeric:tabular-nums}
.pulse input:focus-visible{outline:2px solid var(--green);border-radius:5px}

/* الأسئلة */
.q{padding:14px 0;border-top:1px dashed var(--rule)}
.q:first-of-type{border-top:0;padding-top:2px}
.q-h{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.q-n{font-family:var(--serif);font-size:12px;color:var(--olive-deep);background:var(--olive-bg);
  border:1px solid var(--olive-line);border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums;
  flex:0 0 auto}
.q-t{margin:0;font-size:16.5px;font-weight:700;font-family:var(--serif)}
.q-hint{font-size:12px;color:var(--ink-2);font-weight:400;font-family:var(--sans)}
.opts{display:grid;gap:7px}
.opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:start;cursor:pointer;
  border:1px solid var(--rule);border-radius:11px;padding:11px 12px;background:#fff;
  font-size:14.5px;line-height:1.55;transition:border-color .15s,background .15s}
.opt .sw{width:16px;height:16px;border-radius:5px;border:1px solid rgba(38,41,31,.3);flex:0 0 auto;margin-top:3px}
.opt .tx{flex:1}
.opt:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.opt[aria-pressed=true]{font-weight:600}
.opt[aria-pressed=true] .sw{box-shadow:inset 0 0 0 2px #fff, 0 0 0 1.5px currentColor}
.q.answered .q-n{background:var(--green);color:#fff;border-color:var(--green)}

textarea.inp{min-height:120px;resize:vertical;line-height:1.7}
details summary{font-family:var(--serif);font-size:16px;font-weight:700;cursor:pointer;
  list-style:none;display:flex;align-items:center;gap:7px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+";color:var(--green);font-weight:700;font-size:19px;line-height:1}
details[open] summary::before{content:"−"}
.help{font-size:14px;color:var(--ink-2);margin-top:10px}
.help p{margin:0 0 9px}
.help b{color:var(--ink)}
#warn:empty{display:none}
#warn{background:#FDEEF0;border:1px solid #E7B9BF;border-radius:9px;padding:9px 11px;color:#8A3242}

/* شريط الأدوات */
.bar{position:fixed;left:0;right:0;bottom:0;inset:auto 0 0 0;z-index:50;background:rgba(251,250,245,.96);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--rule);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0))}
.bar-in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.btn{flex:1;padding:12px 8px;border-radius:11px;border:1px solid var(--green);background:#fff;
  color:var(--green);font-weight:700;font-size:14.5px;line-height:1.3;cursor:pointer}
html:not([lang=ar]) .btn{font-size:13.5px}
.btn.pri{background:var(--green);color:#fff}
.btn.gh{flex:0 0 auto;border-color:var(--rule);color:var(--ink-2);padding:13px 14px;font-weight:600}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--olive-deep);outline-offset:2px}
.saved{font-size:11.5px;color:var(--ink-2);text-align:center;max-width:760px;margin:6px auto 0}

/* ============ ورقة الطباعة ============ */
.sheet{display:none}
body.preview .sheet{display:block;background:#fff;max-width:760px;margin:0 auto 120px;
  padding:14px;border:1px solid var(--rule);border-radius:var(--r)}
body.preview main{display:none}

.pg{page-break-after:always;break-after:page}
.pg:last-child{page-break-after:auto;break-after:auto}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sh-head .t{font-family:var(--serif);font-size:17pt;font-weight:700;text-align:center;flex:1}
.sh-head img{width:62px;height:62px;object-fit:contain}
.sh-box{background:var(--olive-bg);border:1.2px solid var(--olive-line);border-radius:9px;
  font-family:var(--serif);font-size:15pt;font-weight:700;text-align:center;padding:7px 16px}
.sh-meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.sh-meta div{background:var(--olive-bg);border:1px solid var(--olive-line);border-radius:6px;
  padding:5px 9px;font-size:9.5pt;flex:1 1 auto;min-width:0}
.sh-meta b{font-weight:600}
.sh-meta .w{flex:2 1 200px}

table.sh{border-collapse:collapse;width:100%;table-layout:fixed;margin-bottom:9px}
table.sh th,table.sh td{border:.8px solid #7A7A6A;padding:4px 5px;vertical-align:top;
  font-size:8.3pt;line-height:1.42}
table.sh .lbl{font-family:var(--serif);font-size:9.6pt;font-weight:700;width:16.5%;
  vertical-align:middle;background:#fff}
table.sh .lbl small{display:block;font-family:var(--sans);font-size:7pt;font-weight:400;color:#555}
table.sh td.o{width:20.875%}
.cb{display:inline-block;width:8.5pt;height:8.5pt;border:.9px solid #333;margin-inline-end:4px;
  vertical-align:-1pt;text-align:center;line-height:8pt;font-size:8pt;font-weight:700;background:#fff}
td.on{font-weight:700;box-shadow:inset 0 0 0 1.6px #26291F}
.sec-t{font-family:var(--serif);font-size:11pt;font-weight:700;margin:2px 0 5px;
  border-bottom:1.2px solid var(--olive-line);padding-bottom:2px;color:var(--olive-deep)}
table.ph{border-collapse:collapse;width:100%;margin-bottom:12px;table-layout:fixed}
table.ph th,table.ph td{border:.8px solid #7A7A6A;padding:4px;text-align:center;font-size:8pt}
table.ph .q{background:#FCF7E3;text-align:start;font-size:8pt;line-height:1.45;width:34%;
  border-top:.8px solid #7A7A6A;padding:4px 5px}
table.ph thead th{background:#EFEFEA;font-weight:600}
table.ph .val{font-size:10pt;font-variant-numeric:tabular-nums}
.sh-extra{border:2.5px dotted #6D7A4A;border-radius:4px;background:#EFEEDC;
  min-height:150px;padding:9px;font-size:9.5pt;line-height:1.8;white-space:pre-wrap}
.sh-sum{width:100%;border-collapse:collapse;margin:6px 0 10px}
.sh-sum td,.sh-sum th{border:.8px solid #7A7A6A;padding:5px 7px;font-size:9pt;text-align:center}
.sh-sum th{background:#EFEFEA;font-weight:600}
.sh-sum .bigv{font-size:13pt;font-weight:700;font-variant-numeric:tabular-nums}
.sh-foot{display:flex;justify-content:space-between;font-size:7.5pt;color:#666;
  border-top:.8px solid var(--rule);padding-top:4px;margin-top:6px}

@page{size:A4;margin:11mm 9mm 9mm}
@media print{
  html,body{background:#fff}
  .top,.bar,main,.saved,#s-lang{display:none!important}
  .sheet{display:block!important;padding:0;border:0;margin:0;max-width:none}
  body.preview .sheet{padding:0;border:0;margin:0;max-width:none}
  table.sh tr,table.ph tr{page-break-inside:avoid;break-inside:avoid}
  .sec-t{page-break-after:avoid;break-after:avoid}
  td.on{box-shadow:none;outline:1.6px solid #26291F;outline-offset:-1.6px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (min-width:640px){ .opts{grid-template-columns:1fr 1fr} }

/* ---------- تحسينات سفاري iOS والأجهزة القديمة ---------- */
button, .opt, .langbtn, .btn, .seg button{touch-action:manipulation;-webkit-touch-callout:none}
img{-webkit-touch-callout:none}
/* احتياط لسفاري الأقدم من 14.5 حيث لا تُدعم inset-inline */
[dir=rtl] .langpick .globe{right:16px} [dir=ltr] .langpick .globe{left:16px}
[dir=rtl] .langpick .caret{left:18px}  [dir=ltr] .langpick .caret{right:18px}
</style>
</head>

<!-- شاشة اختيار اللغة -->

const KEY = "tadawi.mood.v1";
const LKEY = "tadawi.mood.lang";
/* آيفون: إن فُتحت الاستمارة من أيقونة الشاشة الرئيسية بوضع «تطبيق مستقل» فقد لا تظهر شاشة الطباعة */
const IOS_STANDALONE = (navigator.standalone === true);
const IOS_HINT = {
  ar: "ملاحظة للآيفون: إذا لم تظهر شاشة الطباعة من الأيقونة على الشاشة الرئيسية، افتح الاستمارة في متصفح Safari ثم اضغط «حفظ كملف PDF».",
  en: "iPhone note: if the print screen does not appear from the home-screen icon, open the form in Safari and tap “Save as PDF”.",
  fr: "Remarque iPhone : si l’écran d’impression n’apparaît pas depuis l’icône de l’écran d’accueil, ouvrez le formulaire dans Safari puis touchez « Enregistrer en PDF ».",
  tr: "iPhone notu: Ana ekran simgesinden yazdırma ekranı açılmazsa formu Safari’de açıp “PDF olarak kaydet”e dokunun.",
  ru: "Примечание для iPhone: если экран печати не открывается из значка на главном экране, откройте форму в Safari и нажмите «Сохранить как PDF».",
  de: "Hinweis für iPhone: Erscheint der Druckbildschirm nicht über das Symbol auf dem Home-Bildschirm, öffnen Sie das Formular in Safari und tippen Sie auf „Als PDF speichern“."
};
let LANG = "ar";
let S = {sex:"", answers:{}, pulse:{}};

const $ = id => document.getElementById(id);
const u = k => D.ui[k][LANG];
const tx = o => o[LANG];

/* ---------- التخزين ---------- */
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){}
  /* ترقية من نسخة كانت تحفظ الجنس بالنص العربي */
  if(S.sex==="أنثى") S.sex="f";
  else if(S.sex==="ذكر") S.sex="m";
}
let t=null;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  clearTimeout(t);
  status(u("statusSaved"));
  t=setTimeout(()=>status(""),1800);
}
function status(m){ $("status").textContent=m; }

/* ---------- اللغة ---------- */
function langMeta(c){ return D.langs.find(l=>l.code===c); }
function setLang(code){
  LANG = code;
  const m = langMeta(code);
  document.documentElement.lang = code;
  document.documentElement.dir = m.dir;
  document.body.dir = m.dir;
  try{ localStorage.setItem(LKEY, code); }catch(e){}
}
function renderLangScreen(){
  const s = $("langsel"); s.innerHTML="";
  D.langs.forEach(l=>{
    const o=document.createElement("option");
    o.value=l.code; o.textContent=l.name; o.lang=l.code;
    if(l.code===LANG) o.selected=true;
    s.appendChild(o);
  });
  /* تغيير الاختيار يعاين اللغة فوراً على الشاشة نفسها */
  s.onchange = ()=>{ setLang(s.value); paintLangScreen(); };
  paintLangScreen();
}
function paintLangScreen(){
  $("l-h2").textContent = u("chooseLang");
  $("l-app").textContent = u("appTitle");
  $("langgo").textContent = u("continueBtn");
  const s = $("langsel"); if(s) s.value = LANG;
}
function showApp(){
  $("s-lang").classList.add("hide");
  $("app").classList.remove("hide");
  applyTexts(); buildPulse(); buildQs(); bindSex();
  window.scrollTo(0,0);
}

/* كل النصوص الثابتة في الواجهة */
function applyTexts(){
  $("h-title").textContent = u("appTitle");
  $("h-sub").textContent   = u("doctor") + " — " + u("brand");
  $("btn-lang").title      = u("changeLang");
  [["t-patient","patientData"],["t-savedLocally","savedLocally"],["t-fullName","fullName"],
   ["t-sex","sex"],["t-male","male"],["t-female","female"],["t-date","date"],["t-age","age"],
   ["t-height","height"],["t-weight","weight"],["t-pulseTitle","pulseTitle"],
   ["t-pulseNote","pulseNote"],["t-extraTitle","extraTitle"],["t-extraNote","extraNote"],
   ["t-helpQ","helpQ"]].forEach(([id,k])=>{ $(id).textContent = u(k); });
  $("t-helpIphone").innerHTML = u("helpIphone");
  $("t-helpAndroid").innerHTML = u("helpAndroid");
  $("ios-hint").textContent = IOS_HINT[LANG] || IOS_HINT.en;
  $("ios-hint").classList.toggle("hide", !IOS_STANDALONE);
  $("extra").placeholder = u("extraPlaceholder");
  $("print").textContent = u("btnPrint");
  $("prev").textContent  = document.body.classList.contains("preview") ? u("btnBack") : u("btnPreview");
  $("clear").textContent = u("btnClear");
  $("clear").title = u("btnClearTitle");
  document.querySelector('#sex').setAttribute("aria-label", u("sex"));
}

/* ---------- الأسئلة المرئية ---------- */
function visibleRows(){
  const out=[];
  D.sections.forEach(sec=>{
    if(sec.female && S.sex!=="f") return;
    sec.rows.forEach(r=>out.push(r));
  });
  return out;
}

/* ---------- بناء واجهة الأسئلة ---------- */
function buildQs(){
  const host=$("qs"); host.innerHTML="";
  let n=0;
  D.sections.forEach(sec=>{
    if(sec.female && S.sex!=="f") return;
    const card=document.createElement("section"); card.className="card";
    const h2=document.createElement("h2"); h2.textContent=tx(sec.title); card.appendChild(h2);
    sec.rows.forEach(r=>{
      n++;
      const q=document.createElement("div"); q.className="q"; q.dataset.id=r.id;
      const h=document.createElement("div"); h.className="q-h";
      h.innerHTML='<span class="q-n">'+n+'</span><h3 class="q-t">'+esc(tx(r.label))+
        (r.hint?' <span class="q-hint">('+esc(tx(r.hint))+')</span>':'')+'</h3>';
      q.appendChild(h);
      const box=document.createElement("div"); box.className="opts";
      r.opts.forEach((o,i)=>{
        const m=D.moods[i];
        const b=document.createElement("button");
        b.type="button"; b.className="opt"; b.setAttribute("aria-pressed","false");
        b.style.color=m.deep;
        b.innerHTML='<span class="sw" style="background:'+m.sw+'"></span><span class="tx">'+esc(tx(o))+'</span>';
        b.onclick=()=>{
          S.answers[r.id] = (S.answers[r.id]===i) ? null : i;
          if(S.answers[r.id]===null) delete S.answers[r.id];
          paint(); save();
        };
        box.appendChild(b);
      });
      q.appendChild(box); card.appendChild(q);
    });
    host.appendChild(card);
  });
  paint();
}

function paint(){
  document.querySelectorAll(".q").forEach(q=>{
    const sel=S.answers[q.dataset.id];
    const on = sel!==undefined && sel!==null;
    q.classList.toggle("answered", on);
    q.querySelectorAll(".opt").forEach((b,i)=>{
      const hit = on && sel===i;
      b.setAttribute("aria-pressed", hit?"true":"false");
      b.style.borderColor = hit ? D.moods[i].deep : "var(--rule)";
      b.style.background  = hit ? D.moods[i].soft : "#fff";
    });
  });
  spine();
}

/* ---------- شريط المزاج ---------- */
function tally(){
  const c=[0,0,0,0];
  visibleRows().forEach(r=>{ const v=S.answers[r.id]; if(v!==undefined&&v!==null) c[v]++; });
  return c;
}
function spine(){
  const c=tally(), tot=c.reduce((a,b)=>a+b,0), rows=visibleRows().length;
  const sp=$("spine"); sp.innerHTML="";
  D.moods.forEach((m,i)=>{
    const el=document.createElement("i");
    el.style.background=m.sw; el.style.flexGrow=c[i];
    if(m.key==="balg") el.style.boxShadow="inset 0 0 0 1px #DDE0D2";
    sp.appendChild(el);
  });
  $("legend").innerHTML = D.moods.map((m,i)=>
    '<span><i class="dot" style="background:'+m.sw+'"></i>'+esc(tx(m.name))+' <b>'+c[i]+'</b></span>'
  ).join("") + '<span style="color:#5A6152">'+esc(u("answeredOf"))+' <b>'+tot+'</b> '+
    esc(u("ofWord"))+' <b>'+rows+'</b></span>';
}

/* ---------- جدول النبض ---------- */
function buildPulse(){
  let h='<table><thead><tr><th rowspan="2"></th>';
  D.days.forEach(d=>h+='<th colspan="2">'+esc(tx(d))+'</th>');
  h+='</tr><tr>';
  D.days.forEach(()=>D.hands.forEach(x=>h+='<th>'+esc(tx(x))+'</th>'));
  h+='</tr></thead><tbody>';
  D.pulseRows.forEach((q,ri)=>{
    h+='<tr><th>'+esc(tx(q))+'</th>';
    D.days.forEach((_,di)=>D.hands.forEach((_,hi)=>{
      const k='p'+ri+di+hi;
      h+='<td><input type="number" inputmode="numeric" min="0" max="250" data-p="'+k+
         '" aria-label="'+esc(u("pulseAria"))+'" value="'+(S.pulse[k]||"")+'"></td>';
    }));
    h+='</tr>';
  });
  $("pulse").innerHTML=h+'</tbody></table>';
  document.querySelectorAll("[data-p]").forEach(el=>{
    el.oninput=()=>{ S.pulse[el.dataset.p]=el.value; save(); };
  });
}

/* ---------- ورقة الطباعة ---------- */
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function sheetHead(title){
  return '<div class="sh-head"><img src="'+LOGO+'" alt=""><div class="t">'+esc(u("doctor"))+'</div>'+
         '<div style="width:62px"></div></div>'+
         '<div style="display:flex;justify-content:center"><div class="sh-box">'+esc(title)+'</div></div>';
}
function metaBlock(){
  const g=k=>esc((document.querySelector('[data-k="'+k+'"]')||{}).value);
  const sexTxt = S.sex==="f" ? u("female") : (S.sex==="m" ? u("male") : "");
  return '<div class="sh-meta">'+
    '<div class="w"><b>'+esc(u("fullName"))+':</b> '+g("name")+'</div>'+
    '<div><b>'+esc(u("sex"))+':</b> '+esc(sexTxt)+'</div>'+
    '<div><b>'+esc(u("date"))+':</b> '+g("date")+'</div>'+
    '<div><b>'+esc(u("age"))+':</b> '+g("age")+'</div>'+
    '<div><b>'+esc(u("heightShort"))+':</b> '+g("height")+'</div>'+
    '<div><b>'+esc(u("weightShort"))+':</b> '+g("weight")+'</div></div>';
}
function pulseTable(){
  let h='<table class="ph"><thead><tr><th rowspan="2" style="background:#6E6E63"></th>';
  D.days.forEach(d=>h+='<th colspan="2">'+esc(tx(d))+'</th>');
  h+='</tr><tr>';
  D.days.forEach(()=>D.hands.forEach(x=>h+='<th>'+esc(tx(x))+'</th>'));
  h+='</tr></thead><tbody>';
  D.pulseRows.forEach((q,ri)=>{
    h+='<tr><td class="q">'+esc(tx(q))+'</td>';
    D.days.forEach((_,di)=>D.hands.forEach((_,hi)=>
      h+='<td class="val">'+esc(S.pulse['p'+ri+di+hi]||"")+'</td>'));
    h+='</tr>';
  });
  return h+'</tbody></table>';
}
function rowsTable(rows){
  let h='<table class="sh">';
  rows.forEach(r=>{
    const sel=S.answers[r.id];
    h+='<tr><td class="lbl">'+esc(tx(r.label))+(r.hint?'<small>'+esc(tx(r.hint))+'</small>':'')+'</td>';
    r.opts.forEach((o,i)=>{
      const on = sel===i;
      h+='<td class="o'+(on?' on':'')+'" style="background:'+D.moods[i].sw+
         '"><span class="cb">'+(on?'✕':'')+'</span>'+esc(tx(o))+'</td>';
    });
    h+='</tr>';
  });
  return h+'</table>';
}
function summary(){
  const c=tally(), tot=c.reduce((a,b)=>a+b,0), pc = LANG==="ar" ? "٪" : "%";
  let h='<div class="sec-t">'+esc(u("sumTitle"))+'</div><table class="sh-sum"><tr>';
  D.moods.forEach(m=>h+='<th style="background:'+m.sw+'">'+esc(tx(m.name))+
    '<div style="font-weight:400;font-size:7.5pt">'+esc(tx(m.nature))+'</div></th>');
  h+='</tr><tr>';
  c.forEach(v=>h+='<td class="bigv">'+v+'</td>');
  h+='</tr><tr>';
  c.forEach(v=>h+='<td>'+(tot?Math.round(v*100/tot):0)+pc+'</td>');
  h+='</tr></table>'+
    '<div style="font-size:8pt;color:#555">'+esc(u("sumAnswered"))+': '+tot+' '+esc(u("ofWord"))+
    ' '+visibleRows().length+'. '+esc(u("sumNote"))+'</div>';
  return h;
}
/* خطة الصفحات — ثابتة حتى يبقى شكل الاستمارة مطابقاً للأصل في كل مرة. */
const PLAN = [
  {secs:[0], meta:true, pulse:true},
  {secs:[1]},
  {secs:[2,3]},
  {secs:[4], summary:true},
  {secs:[5], extra:true},
];
function buildSheet(){
  const show = i => D.sections[i] && !(D.sections[i].female && S.sex!=="f");
  const ex = esc(($("extra")||{}).value);
  let h='', page=0;
  PLAN.forEach(pl=>{
    const secs = pl.secs.filter(show);
    if(!secs.length && !pl.summary && !pl.extra) return;
    page++;
    const title = (pl.extra && !secs.length) ? u("extraTitle") : u("appTitle");
    h+='<div class="pg">'+sheetHead(title);
    if(pl.meta)  h+=metaBlock();
    if(pl.pulse) h+=pulseTable();
    secs.forEach(i=>{
      h+='<div class="sec-t">'+esc(tx(D.sections[i].title))+'</div>'+rowsTable(D.sections[i].rows);
    });
    if(pl.summary) h+=summary();
    if(pl.extra)   h+='<div class="sec-t">'+esc(u("extraTitle"))+'</div><div class="sh-extra">'+ex+'</div>';
    h+='<div class="sh-foot"><span>'+esc(u("brand"))+' — '+esc(u("doctor"))+'</span><span>'+page+
       '</span></div></div>';
  });
  $("sheet").innerHTML=h;
}

/* ---------- الربط ---------- */
function bindText(){
  document.querySelectorAll("[data-k]").forEach(el=>{
    if(S[el.dataset.k]!==undefined) el.value=S[el.dataset.k];
    el.oninput=()=>{ S[el.dataset.k]=el.value; save(); };
  });
}
function bindSex(){
  const box=$("sex");
  box.querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-pressed", S.sex===b.dataset.v ? "true":"false");
    b.onclick=()=>{
      S.sex=b.dataset.v;
      box.querySelectorAll("button").forEach(x=>
        x.setAttribute("aria-pressed", x.dataset.v===S.sex?"true":"false"));
      buildQs(); save();
    };
  });
}

$("langgo").onclick=()=>{ setLang($("langsel").value); showApp(); };

$("btn-lang").onclick=()=>{
  document.body.classList.remove("preview");
  $("app").classList.add("hide");
  $("s-lang").classList.remove("hide");
  paintLangScreen();
  window.scrollTo(0,0);
};
$("print").onclick=()=>{
  if(!S.sex){ alert(u("alertSex")); return; }
  buildSheet();
  if(IOS_STANDALONE){
    /* نعطي سفاري فرصة لفتح شاشة الطباعة؛ فإن لم تُفتح نشرح للمستخدم */
    let printed=false;
    window.addEventListener("beforeprint", ()=>{ printed=true; }, {once:true});
    setTimeout(()=>{ if(!printed) alert(IOS_HINT[LANG] || IOS_HINT.en); }, 1500);
  }
  window.print();
};
$("prev").onclick=(e)=>{
  const on=document.body.classList.toggle("preview");
  if(on){ buildSheet(); window.scrollTo(0,0); e.target.textContent=u("btnBack"); }
  else{ e.target.textContent=u("btnPreview"); }
};
$("clear").onclick=()=>{
  if(!confirm(u("confirmClear"))) return;
  S={sex:"",answers:{},pulse:{}};
  try{ localStorage.removeItem(KEY); }catch(e){}
  document.querySelectorAll("[data-k]").forEach(el=>el.value="");
  bindSex(); buildPulse(); buildQs(); status(u("statusCleared"));
};

/* هل الحفظ التلقائي متاح فعلاً على هذا المتصفح؟ */
let STORAGE_OK=false;
(function(){
  try{ localStorage.setItem("_t","1"); STORAGE_OK = localStorage.getItem("_t")==="1"; localStorage.removeItem("_t"); }catch(e){}
})();

/* ---------- الإقلاع ---------- */
load(); renderLangScreen(); bindText();
let saved=null; try{ saved = localStorage.getItem(LKEY); }catch(e){}
/* نبدأ دائماً من الصفحة الرئيسية؛ اللغة المحفوظة تُختار مسبقاً في القائمة */
setLang(saved && langMeta(saved) ? saved : "ar");
paintLangScreen();
if(!STORAGE_OK) $("warn").textContent = u("warnNoStorage");
if(!document.querySelector('[data-k="date"]').value){
  const d=new Date();
  document.querySelector('[data-k="date"]').value=
    d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  S.date=document.querySelector('[data-k="date"]').value;
}
</script>
<script>
/* يسجّل عامل الخدمة ليعمل التطبيق بلا إنترنت بعد أول فتح من الرابط (لا يعمل عند فتح الملف محلياً، وهذا طبيعي) */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
